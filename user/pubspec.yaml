name: frontend_user
description: "Frontend User"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # DateTime
  jiffy: ^6.4.4
  intl: ^0.20.2
  http: ^1.6.0
  # Images
  cached_network_image: ^3.2.0 
  image_picker: ^1.2.1
  # Animate
  show_up_animation: ^2.0.0
  auto_animated: ^3.0.1
  # Google Map
  flutter_polyline_points: ^3.1.0
  google_maps_flutter: ^2.1.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  # Firebase And Notification 
  firebase_messaging: ^16.0.4
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  flutter_local_notifications: ^20.1.0
  cloud_firestore: ^6.1.0
  # Local Data Cache
  sqflite: ^2.0.2
  shared_preferences: ^2.0.15
  path: ^1.8.0
  flutter_secure_storage: ^9.2.4
  # Qrcode 
  qr_flutter: ^4.0.0
  mobile_scanner: ^7.1.4
  grouped_list: ^6.0.0
  url_launcher: ^6.3.2
  dropdown_search: ^6.0.2
  badges: ^3.1.2
  # Icon 
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.1.0
  fluttericon: ^2.0.0
  fpdart: ^1.2.0
  # Google Auth
  google_sign_in: ^7.2.0  
  device_preview: ^1.3.1
  responsive_builder: ^0.7.1
  image_pickers: ^2.0.0+2
  # OTP
  flutter_otp_text_field: ^1.5.1+1
  # State Management
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0 
  get_it: ^9.2.1
  flutter_localizations:
    sdk: flutter
  awesome_dialog: ^3.3.0
  rating_dialog: ^2.0.4
  intl_phone_field: ^3.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.0.0  
  build_runner: ^2.4.9 
  json_serializable: ^6.9.0
  bloc_test: ^10.0.0
  mockito: ^5.4.6
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21
  web: false 
  windows: false 
  macos: false 

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/lotties/
    - assets/svg/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Bold.ttf
          weight: 700
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
        
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
